services:
  notification-service:
    user: "${NOTIFICATION_UID:-1000}:${NOTIFICATION_GID:-1000}"
    build:
      context: ./services/notification-service
      additional_contexts:
        infra: ./infrastructure
    restart: unless-stopped
    depends_on:
      autodiscovery:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      notification-cache-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_ENV: dev
      REDIS_URL: 'redis://notification-cache-redis:6379'
      MESSENGER_TRANSPORT_DSN: "amqp://${AUTH_RABITMQ_USER}:${AUTH_RABITMQ_PASSWORD}@rabbitmq:5672/%2f"
      DATABASE_URL: "mysql://${NOTIFICATION_DB_USER:-notification_app}:${NOTIFICATION_DB_PASSWORD:-notification_app}@notification-db:3306/${NOTIFICATION_DB_NAME:-notification_db}?serverVersion=8.4&charset=utf8mb4"
      MAILER_DSN: "${MAILER_DSN:-smtp://mailpit:1025}"
      AUTH_SERVICE_URL: "http://authentication-service-web"
      AUTH_INTERNAL_TOKEN: "${AUTH_INTERNAL_TOKEN:-change_internal_token}"
      CONSUL_SERVICE_NAME: "notification-service"
      CONSUL_SERVICE_PORT: "9000"
      CONSUL_HTTP_ADDR: "http://autodiscovery:8500"
    entrypoint:
      - /bin/sh
      - -c
      - php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration && exec /usr/local/bin/register.sh
    expose:
      - "9000"
    volumes:
      - ./services/notification-service:/srv/app
      - ./services/notification-service/docker/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    networks:
      - microservice_net
    develop:
      watch:
        - action: sync
          path: ./services/notification-service/src
          target: /srv/app/src
        - action: sync+restart
          path: ./services/notification-service/config
          target: /srv/app/config
        - action: sync
          path: ./services/notification-service/migrations
          target: /srv/app/migrations
        - action: sync
          path: ./services/notification-service/templates
          target: /srv/app/templates
        - action: sync
          path: ./services/notification-service/public
          target: /srv/app/public
        - action: rebuild
          path: ./services/notification-service/composer.json
        - action: rebuild
          path: ./services/notification-service/composer.lock
        - action: rebuild
          path: ./services/notification-service/Dockerfile
        - action: rebuild
          path: ./services/notification-service/docker/php.ini
        - action: rebuild
          path: ./services/notification-service/docker/php-fpm.conf

  notification-service-web:
    build:
      context: ./services/notification-service/
      dockerfile: nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      - notification-service
    expose:
      - "8080"
    networks:
      - microservice_net
    develop:
      watch:
        - action: sync+restart
          path: ./services/notification-service/docker/nginx.conf
          target: /etc/nginx/conf.d/default.conf
        - action: rebuild
          path: ./services/notification-service/nginx.Dockerfile

  notification-service-consumer:
    build:
      context: ./services/notification-service
      additional_contexts:
        infra: ./infrastructure
    restart: unless-stopped
    user: www-data
    depends_on:
      notification-db:
        condition: service_healthy
      notification-cache-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notification-service:
        condition: service_started
    environment:
      APP_ENV: dev
      REDIS_URL: 'redis://notification-cache-redis:6379'
      MESSENGER_TRANSPORT_DSN: "amqp://${AUTH_RABITMQ_USER}:${AUTH_RABITMQ_PASSWORD}@rabbitmq:5672/%2f"
      DATABASE_URL: "mysql://${NOTIFICATION_DB_USER:-notification_app}:${NOTIFICATION_DB_PASSWORD:-notification_app}@notification-db:3306/${NOTIFICATION_DB_NAME:-notification_db}?serverVersion=8.4&charset=utf8mb4"
      MAILER_DSN: "${MAILER_DSN:-smtp://mailpit:1025}"
      AUTH_SERVICE_URL: "http://authentication-service-web"
      AUTH_INTERNAL_TOKEN: "${AUTH_INTERNAL_TOKEN:-change_internal_token}"
    command: ["php", "bin/console", "messenger:consume", "notification_events", "--time-limit=3600", "--memory-limit=128M"]
    networks:
      - microservice_net
    develop:
      watch:
        - action: sync+restart
          path: ./services/notification-service/src
          target: /srv/app/src
        - action: sync+restart
          path: ./services/notification-service/config
          target: /srv/app/config
        - action: sync+restart
          path: ./services/notification-service/migrations
          target: /srv/app/migrations
        - action: rebuild
          path: ./services/notification-service/composer.json
        - action: rebuild
          path: ./services/notification-service/composer.lock
        - action: rebuild
          path: ./services/notification-service/Dockerfile
        - action: rebuild
          path: ./services/notification-service/docker/php.ini
        - action: rebuild
          path: ./services/notification-service/docker/php-fpm.conf

  notification-service-worker:
    build:
      context: ./services/notification-service
      additional_contexts:
        infra: ./infrastructure
    restart: unless-stopped
    user: www-data
    depends_on:
      notification-db:
        condition: service_healthy
      notification-cache-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notification-service:
        condition: service_started
    environment:
      APP_ENV: dev
      REDIS_URL: 'redis://notification-cache-redis:6379'
      MESSENGER_TRANSPORT_DSN: "amqp://${AUTH_RABITMQ_USER}:${AUTH_RABITMQ_PASSWORD}@rabbitmq:5672/%2f"
      DATABASE_URL: "mysql://${NOTIFICATION_DB_USER:-notification_app}:${NOTIFICATION_DB_PASSWORD:-notification_app}@notification-db:3306/${NOTIFICATION_DB_NAME:-notification_db}?serverVersion=8.4&charset=utf8mb4"
      MAILER_DSN: "${MAILER_DSN:-smtp://mailpit:1025}"
      AUTH_SERVICE_URL: "http://authentication-service-web"
      AUTH_INTERNAL_TOKEN: "${AUTH_INTERNAL_TOKEN:-change_internal_token}"
    command:
      - /bin/sh
      - -c
      - "while true; do php bin/console app:deliveries:process --limit=50; sleep 10; done"
    networks:
      - microservice_net
    develop:
      watch:
        - action: sync+restart
          path: ./services/notification-service/src
          target: /srv/app/src
        - action: sync+restart
          path: ./services/notification-service/config
          target: /srv/app/config
        - action: sync+restart
          path: ./services/notification-service/migrations
          target: /srv/app/migrations
        - action: rebuild
          path: ./services/notification-service/composer.json
        - action: rebuild
          path: ./services/notification-service/composer.lock
        - action: rebuild
          path: ./services/notification-service/Dockerfile
        - action: rebuild
          path: ./services/notification-service/docker/php.ini
        - action: rebuild
          path: ./services/notification-service/docker/php-fpm.conf

  notification-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${NOTIFICATION_DB_NAME:-notification_db}
      MYSQL_USER: ${NOTIFICATION_DB_USER:-notification_app}
      MYSQL_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_app}
      MYSQL_ROOT_PASSWORD: ${NOTIFICATION_DB_ROOT_PASSWORD:-root}
    volumes:
      - notification_db_data:/var/lib/mysql
    networks:
      - microservice_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-cache-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - notification_redis_data:/data
    networks:
      - microservice_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - microservice_net
