name: Product Service CI

on:
  push:
    branches: [main]
    paths:
      - "services/product-service/**"
  pull_request:
    paths:
      - "services/product-service/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Product Service Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      MESSENGER_TRANSPORT_DSN: in-memory://

    defaults:
      run:
        working-directory: services/product-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Prepare environment
        run: |
          mkdir -p var
          cp .env.test .env

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: services/product-service
          composer-options: "--prefer-dist --no-progress --no-scripts"

      - name: Static analysis
        run: composer stan

      - name: Rector
        run: composer rector:check

      - name: Code style
        run: composer cs:check

      - name: Tests
        run: composer unit:test

      - name: Security scan
        run: composer security:dependencies

      - name: Semgrep Security Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan --config auto --error .
