name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  product-service:
    name: Product service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      MESSENGER_TRANSPORT_DSN: in-memory://

    defaults:
      run:
        working-directory: services/product-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Prepare var directory
        run: mkdir -p var

      - name: Prepare test environment
        run: cp .env.test .env

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: services/product-service
          composer-options: "--prefer-dist --no-progress --no-scripts"

      - name: Static analysis
        run: composer stan

      - name: Rector
        run: composer rector:check

      - name: Code style
        run: composer cs:check

      - name: Tests
        run: composer unit:test
