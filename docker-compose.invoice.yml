services:
  invoices-service:
    container_name: invoices-service
    user: "${INVOICE_UID:-1000}:${INVOICE_GID:-1000}"
    build:
      context: ./services/invoice-service
      additional_contexts:
        infra: ./infrastructure
    restart: unless-stopped
    depends_on:
      autodiscovery:
        condition: service_healthy
      invoices-db:
        condition: service_healthy
      invoices-cache-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: dev
      REDIS_URL: 'redis://invoices-cache-redis:6379'
      MESSENGER_TRANSPORT_DSN: "amqp://${AUTH_RABITMQ_USER}:${AUTH_RABITMQ_PASSWORD}@rabbitmq:5672/%2f"
      DATABASE_URL: "postgresql://${INVOICE_DB_USER:-invoice_app}:${INVOICE_DB_PASSWORD:-invoice_app}@invoices-db:5432/${INVOICE_DB_NAME:-invoice_db}?serverVersion=16&charset=utf8"
      CONSUL_SERVICE_NAME: "invoice-service"
      CONSUL_SERVICE_PORT: "9000"
      CONSUL_HTTP_ADDR: "http://autodiscovery:8500"
    entrypoint:
      - /bin/sh
      - -c
      - php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration && exec /usr/local/bin/register.sh
    expose:
      - "9000"
    volumes:
      - ./services/invoice-service:/srv/app
      - ./services/invoice-service/docker/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - ./services/invoice-service/docker/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    networks:
      - microservice_net
    develop:
      watch:
        - action: sync
          path: ./services/invoice-service/src
          target: /srv/app/src
        - action: sync+restart
          path: ./services/invoice-service/config
          target: /srv/app/config
        - action: sync
          path: ./services/invoice-service/migrations
          target: /srv/app/migrations
        - action: sync
          path: ./services/invoice-service/templates
          target: /srv/app/templates
        - action: sync
          path: ./services/invoice-service/public
          target: /srv/app/public
        - action: rebuild
          path: ./services/invoice-service/composer.json
        - action: rebuild
          path: ./services/invoice-service/composer.lock
        - action: rebuild
          path: ./services/invoice-service/Dockerfile
        - action: rebuild
          path: ./services/invoice-service/docker/php.ini
        - action: rebuild
          path: ./services/invoice-service/docker/php-fpm.conf

  invoice-service-web:
    container_name: invoice-service-web
    build:
      context: ./services/invoice-service/
      dockerfile: nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      - invoices-service
    expose:
      - "80"
    networks:
      microservice_net:
        aliases:
          - invoice-service-web
    develop:
      watch:
        - action: sync+restart
          path: ./services/invoice-service/docker/nginx.root.conf
          target: /etc/nginx/conf.d/default.conf
        - action: rebuild
          path: ./services/invoice-service/nginx.Dockerfile

  invoices-db:
    container_name: invoices-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVOICE_DB_NAME:-invoice_db}
      POSTGRES_USER: ${INVOICE_DB_USER:-invoice_app}
      POSTGRES_PASSWORD: ${INVOICE_DB_PASSWORD:-invoice_app}
    volumes:
      - invoice_db_data:/var/lib/postgresql/data
    networks:
      - microservice_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVOICE_DB_USER:-invoice_app} -d ${INVOICE_DB_NAME:-invoice_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  invoices-cache-redis:
    container_name: invoices-cache-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - invoice_redis_data:/data
    networks:
      - microservice_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
