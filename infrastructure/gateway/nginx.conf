user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Docker embedded DNS. Resolving upstreams at request time lets the
    # gateway boot before (or while) the per-service web containers start.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # The internal user directory is only reachable from the Docker network.
        # This block must precede the broader /api/authenticator/ location.
        location /api/authenticator/internal/ {
            return 404;
        }

        location /api/authenticator/ {
            set $upstream authentication-service-web:80;
            proxy_pass http://$upstream;
        }

        location /api/contacts {
            set $upstream contact-service-web:80;
            rewrite ^/api/contacts(/.*)?$ /api/v1$1 break;
            proxy_pass http://$upstream;
        }

        location /api/inventories {
            set $upstream inventory-service-web:80;
            rewrite ^/api/inventories(/.*)?$ /api/v1/inventories$1 break;
            proxy_pass http://$upstream;
        }

        location /api/invoices {
            set $upstream invoice-service-web:80;
            rewrite ^/api/invoices(/.*)?$ /api/v1/invoices$1 break;
            proxy_pass http://$upstream;
        }

        location /api/payments {
            set $upstream payment-service-web:80;
            rewrite ^/api/payments(/.*)?$ /api/v1/payments$1 break;
            proxy_pass http://$upstream;
        }

        location /api/payment-plans {
            set $upstream payment-service-web:80;
            rewrite ^/api/payment-plans(/.*)?$ /api/v1/payment-plans$1 break;
            proxy_pass http://$upstream;
        }

        location /api/installments {
            set $upstream payment-service-web:80;
            rewrite ^/api/installments(/.*)?$ /api/v1/installments$1 break;
            proxy_pass http://$upstream;
        }

        location /api/reminders {
            set $upstream payment-service-web:80;
            rewrite ^/api/reminders(/.*)?$ /api/v1/reminders$1 break;
            proxy_pass http://$upstream;
        }

        location /api/allocations {
            set $upstream payment-service-web:80;
            rewrite ^/api/allocations(/.*)?$ /api/v1/allocations$1 break;
            proxy_pass http://$upstream;
        }

        location /api/settings {
            set $upstream payment-service-web:80;
            rewrite ^/api/settings(/.*)?$ /api/v1/settings$1 break;
            proxy_pass http://$upstream;
        }

        location /api/products {
            set $upstream product-service-web:8080;
            rewrite ^/api/products(/.*)?$ /api/v1$1 break;
            proxy_pass http://$upstream;
        }

        location /api/notifications {
            set $upstream notification-service-web:8080;
            rewrite ^/api/notifications(/.*)?$ /api/v1$1 break;
            proxy_pass http://$upstream;
        }

        location /api/orders {
            set $upstream order-service-web:8080;
            rewrite ^/api/orders(/.*)?$ /api/v1/orders$1 break;
            proxy_pass http://$upstream;
        }

        location / {
            return 404;
        }
    }
}
