server {
    listen 80;
    server_name _;

    # Docker embedded DNS. Resolve the FPM upstream per request so a recreated
    # invoices-service container's new IP is picked up instead of a cached one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /srv/app/public;
    index index.php;
    client_max_body_size 10m;

    location = /health {
        access_log off;
        return 204;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        set $invoice_fpm invoices-service:9000;
        fastcgi_pass $invoice_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/app/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /srv/app/public;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
