framework:
    messenger:
        transports:
            inventory:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: messages
                        type: fanout
                    queues:
                        inventory: ~
        routing:
            App\Message\ProductUpdated: inventory

when@test:
    framework:
        messenger:
            transports:
                inventory: 'in-memory://'
