framework:
    messenger:
        transports:
            inventory:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: messages
                        type: fanout
                    queues:
                        inventory: ~
        routing:
            # Route product events from Product Service
            App\Event\ProductUpdated: inventory
            # Route order events from Order Service
            App\Event\PurchaseOrderReceivedV1: inventory
            App\Event\OrderShippedV1: inventory

when@test:
    framework:
        messenger:
            transports:
                inventory: 'in-memory://'