security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            stateless: true
            entry_point: App\Security\ApiKeyAuthenticator
            provider: app_user_provider
            json_login:
                check_path: app_api_user_login
                username_path: email
                password_path: password
                success_handler: App\Security\ApiLoginSuccessHandler
            login_throttling:
                max_attempts: 3
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator

    access_control:
        - { path: ^/api/user_register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/user_login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/verify/email$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/api/verify/email, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
