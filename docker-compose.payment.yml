services:
  payments-service:
    user: "${PAYMENT_UID:-1000}:${PAYMENT_GID:-1000}"
    build:
      context: ./services/payment-service
      additional_contexts:
        infra: ./infrastructure
    restart: unless-stopped
    depends_on:
      autodiscovery:
        condition: service_healthy
      payments-db:
        condition: service_healthy
      payments-cache-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: dev
      REDIS_URL: 'redis://payments-cache-redis:6379'
      MESSENGER_TRANSPORT_DSN: "amqp://${AUTH_RABITMQ_USER}:${AUTH_RABITMQ_PASSWORD}@rabbitmq:5672/%2f"
      DATABASE_URL: "mysql://${PAYMENT_DB_USER:-payments_app}:${PAYMENT_DB_PASSWORD:-change_payments_password}@payments-db:3306/${PAYMENT_DB_NAME:-payments_db}?serverVersion=8.4&charset=utf8mb4"
      CONSUL_SERVICE_NAME: "payment-service"
      CONSUL_SERVICE_PORT: "9000"
      CONSUL_HTTP_ADDR: "http://autodiscovery:8500"
    entrypoint:
      - /bin/sh
      - -c
      - php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration && exec /usr/local/bin/register.sh
    expose:
      - "9000"
    volumes:
      - ./services/payment-service:/srv/app
      - ./services/payment-service/docker/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    networks:
      - microservice_net
    develop:
      watch:
        - action: sync
          path: ./services/payment-service/src
          target: /srv/app/src
        - action: sync+restart
          path: ./services/payment-service/config
          target: /srv/app/config
        - action: sync
          path: ./services/payment-service/migrations
          target: /srv/app/migrations
        - action: sync
          path: ./services/payment-service/public
          target: /srv/app/public
        - action: rebuild
          path: ./services/payment-service/composer.json
        - action: rebuild
          path: ./services/payment-service/composer.lock
        - action: rebuild
          path: ./services/payment-service/Dockerfile
        - action: rebuild
          path: ./services/payment-service/docker/php.ini
        - action: rebuild
          path: ./services/payment-service/docker/php-fpm.conf

  payment-service-web:
    build:
      context: ./services/payment-service/
      dockerfile: nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      - payments-service
    expose:
      - "80"
    networks:
      - microservice_net
    develop:
      watch:
        - action: sync+restart
          path: ./services/payment-service/docker/nginx.conf
          target: /etc/nginx/conf.d/default.conf
        - action: rebuild
          path: ./services/payment-service/nginx.Dockerfile

  payment-service-consumer:
    build:
      context: ./services/payment-service
      additional_contexts:
        infra: ./infrastructure
    restart: unless-stopped
    user: www-data
    depends_on:
      payments-db:
        condition: service_healthy
      payments-cache-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payments-service:
        condition: service_started
    environment:
      APP_ENV: dev
      REDIS_URL: 'redis://payments-cache-redis:6379'
      MESSENGER_TRANSPORT_DSN: "amqp://${AUTH_RABITMQ_USER}:${AUTH_RABITMQ_PASSWORD}@rabbitmq:5672/%2f"
      DATABASE_URL: "mysql://${PAYMENT_DB_USER:-payments_app}:${PAYMENT_DB_PASSWORD:-change_payments_password}@payments-db:3306/${PAYMENT_DB_NAME:-payments_db}?serverVersion=8.4&charset=utf8mb4"
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    volumes:
      - ./services/payment-service:/srv/app
      - ./services/payment-service/docker/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    healthcheck:
      disable: true
    networks:
      - microservice_net
    develop:
      watch:
        - action: sync+restart
          path: ./services/payment-service/src
          target: /srv/app/src
        - action: sync+restart
          path: ./services/payment-service/config
          target: /srv/app/config
        - action: sync+restart
          path: ./services/payment-service/migrations
          target: /srv/app/migrations
        - action: rebuild
          path: ./services/payment-service/composer.json
        - action: rebuild
          path: ./services/payment-service/composer.lock
        - action: rebuild
          path: ./services/payment-service/Dockerfile
        - action: rebuild
          path: ./services/payment-service/docker/php.ini
        - action: rebuild
          path: ./services/payment-service/docker/php-fpm.conf

  payments-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${PAYMENT_DB_NAME:-payments_db}
      MYSQL_USER: ${PAYMENT_DB_USER:-payments_app}
      MYSQL_PASSWORD: ${PAYMENT_DB_PASSWORD:-change_payments_password}
      MYSQL_ROOT_PASSWORD: ${PAYMENT_DB_ROOT_PASSWORD:-change_payments_root_password}
    volumes:
      - payment_db_data:/var/lib/mysql
    networks:
      - microservice_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  payments-cache-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - payment_redis_data:/data
    networks:
      - microservice_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
