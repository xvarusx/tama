services:
  products-service:
    build:
      context: ./services/product-service
      additional_contexts:
        infra: ./infrastructure
    restart: unless-stopped
    depends_on:
      autodiscovery:
        condition: service_healthy
      products-db:
        condition: service_healthy
      products-cache-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: dev
      REDIS_URL: 'redis://products-cache-redis:6379'
      MESSENGER_TRANSPORT_DSN: "amqp://${AUTH_RABITMQ_USER}:${AUTH_RABITMQ_PASSWORD}@rabbitmq:5672/%2f"
      DATABASE_URL: "mysql://${PRODUCTS_DB_USER:-products}:${PRODUCTS_DB_PASSWORD:-products}@products-db:3306/${PRODUCTS_DB_NAME:-products_db}?serverVersion=8.4&charset=utf8mb4"
      CONSUL_SERVICE_NAME: "product-service"
      CONSUL_SERVICE_PORT: "9000"
      CONSUL_HTTP_ADDR: "http://autodiscovery:8500"
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p public/products-images && chmod 0777 public/products-images && php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration && exec /usr/local/bin/register.sh
    expose:
      - "9000"
    volumes:
      - ./services/product-service:/srv/app
      - ./services/product-service/docker/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    networks:
      - microservice_net
    develop:
      watch:
        - action: rebuild
          path: ./services/product-service/composer.json
        - action: rebuild
          path: ./services/product-service/composer.lock
        - action: rebuild
          path: ./services/product-service/Dockerfile
        - action: rebuild
          path: ./services/product-service/docker/php.ini
        - action: rebuild
          path: ./services/product-service/docker/php-fpm.conf

  product-service-web:
    build:
      context: ./services/product-service/
      dockerfile: nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      - products-service
    expose:
      - "80"
    networks:
      - microservice_net
    develop:
      watch:
        - action: sync+restart
          path: ./services/product-service/docker/nginx.conf
          target: /etc/nginx/conf.d/default.conf
        - action: rebuild
          path: ./services/product-service/nginx.Dockerfile

  products-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${PRODUCTS_DB_NAME:-products_db}
      MYSQL_USER: ${PRODUCTS_DB_USER:-products}
      MYSQL_PASSWORD: ${PRODUCTS_DB_PASSWORD:-products}
      MYSQL_ROOT_PASSWORD: ${PRODUCTS_DB_ROOT_PASSWORD:-root}
    volumes:
      - product_db_data:/var/lib/mysql
    networks:
      - microservice_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  products-cache-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - product_redis_data:/data
    networks:
      - microservice_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

