services:
  orders-service:
    container_name: orders-service
    user: "${ORDER_UID:-1000}:${ORDER_GID:-1000}"
    build:
      context: ./services/order-service
      additional_contexts:
        infra: ./infrastructure
    restart: unless-stopped
    depends_on:
      autodiscovery:
        condition: service_healthy
      orders-db:
        condition: service_healthy
      orders-cache-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: dev
      REDIS_URL: 'redis://orders-cache-redis:6379'
      MESSENGER_TRANSPORT_DSN: "amqp://${AUTH_RABITMQ_USER}:${AUTH_RABITMQ_PASSWORD}@rabbitmq:5672/%2f"
      DATABASE_URL: "mysql://${ORDER_DB_USER:-order}:${ORDER_DB_PASSWORD:-order}@orders-db:3306/${ORDER_DB_NAME:-order_db}?serverVersion=8.4&charset=utf8mb4"
      CONSUL_SERVICE_NAME: "order-service"
      CONSUL_SERVICE_PORT: "9000"
      CONSUL_HTTP_ADDR: "http://autodiscovery:8500"
    entrypoint:
      - /bin/sh
      - -c
      - php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration && exec /usr/local/bin/register.sh
    expose:
      - "9000"
    volumes:
      - ./services/order-service:/srv/app
      - ./services/order-service/docker/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    networks:
      - microservice_net
    develop:
      watch:
        - action: rebuild
          path: ./services/order-service/composer.json
        - action: rebuild
          path: ./services/order-service/composer.lock
        - action: rebuild
          path: ./services/order-service/Dockerfile
        - action: rebuild
          path: ./services/order-service/docker/php.ini
        - action: rebuild
          path: ./services/order-service/docker/php-fpm.conf

  order-service-web:
    container_name: order-service-web
    build:
      context: ./services/order-service/
      dockerfile: nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      - orders-service
    expose:
      - "8080"
    networks:
      microservice_net:
        aliases:
          - orders-service-web
    develop:
      watch:
        - action: sync+restart
          path: ./services/order-service/docker/nginx.root.conf
          target: /etc/nginx/conf.d/default.conf
        - action: rebuild
          path: ./services/order-service/nginx.Dockerfile

  orders-db:
    container_name: orders-db
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${ORDER_DB_NAME:-order_db}
      MYSQL_USER: ${ORDER_DB_USER:-order}
      MYSQL_PASSWORD: ${ORDER_DB_PASSWORD:-order}
      MYSQL_ROOT_PASSWORD: ${ORDER_DB_ROOT_PASSWORD:-change_order_root_password}
    volumes:
      - order_db_data:/var/lib/mysql
    networks:
      - microservice_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  orders-cache-redis:
    container_name: orders-cache-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - order_redis_data:/data
    networks:
      - microservice_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
