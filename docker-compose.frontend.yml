services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "5173:5173"
    environment:
      # Vite proxies /api/* to the gateway, so the browser only talks to :5173.
      VITE_API_PROXY_TARGET: http://api-gateway
    command: ["pnpm", "dev", "--host", "0.0.0.0"]
    networks:
      - microservice_net
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml
        - action: rebuild
          path: ./frontend/pnpm-workspace.yaml
        - action: rebuild
          path: ./frontend/Dockerfile


