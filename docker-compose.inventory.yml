services:
  inventory-migrate:
    build:
      context: ./services/inventory-service
      additional_contexts:
        infra: ./infrastructure
    restart: "no"
    depends_on:
      inventory-db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      REDIS_URL: 'redis://inventory-cache-redis:6379'
      MESSENGER_TRANSPORT_DSN: "amqp://${AUTH_RABITMQ_USER}:${AUTH_RABITMQ_PASSWORD}@rabbitmq:5672/%2f"
      DATABASE_URL: "mysql://${INVENTORY_DB_USER}:${INVENTORY_DB_PASSWORD}@inventory-db:3306/${INVENTORY_DB_NAME}?serverVersion=8.4&charset=utf8mb4"
    command: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
    networks:
      - microservice_net

  inventory-service:
    build:
      context: ./services/inventory-service
      additional_contexts:
        infra: ./infrastructure
    restart: unless-stopped
    depends_on:
      autodiscovery:
        condition: service_healthy
      inventory-db:
        condition: service_healthy
      inventory-cache-redis:
        condition: service_healthy
      inventory-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: dev
      REDIS_URL: 'redis://inventory-cache-redis:6379'
      MESSENGER_TRANSPORT_DSN: "amqp://${AUTH_RABITMQ_USER}:${AUTH_RABITMQ_PASSWORD}@rabbitmq:5672/%2f"
      DATABASE_URL: "mysql://${INVENTORY_DB_USER}:${INVENTORY_DB_PASSWORD}@inventory-db:3306/${INVENTORY_DB_NAME}?serverVersion=8.4&charset=utf8mb4"
      CONSUL_SERVICE_NAME: "inventory-service"
      CONSUL_SERVICE_PORT: "9000"
      CONSUL_HTTP_ADDR: "http://autodiscovery:8500"
    entrypoint: ["/usr/local/bin/register.sh"]
    expose:
      - "9000"
    networks:
      - microservice_net

  inventory-worker:
    build:
      context: ./services/inventory-service
      additional_contexts:
        infra: ./infrastructure
    restart: unless-stopped
    user: www-data
    depends_on:
      inventory-db:
        condition: service_healthy
      inventory-cache-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: dev
      REDIS_URL: 'redis://inventory-cache-redis:6379'
      MESSENGER_TRANSPORT_DSN: "amqp://${AUTH_RABITMQ_USER}:${AUTH_RABITMQ_PASSWORD}@rabbitmq:5672/%2f"
      DATABASE_URL: "mysql://${INVENTORY_DB_USER}:${INVENTORY_DB_PASSWORD}@inventory-db:3306/${INVENTORY_DB_NAME}?serverVersion=8.4&charset=utf8mb4"
    command: ["php", "bin/console", "messenger:consume", "inventory", "--time-limit=3600", "--memory-limit=128M", "-vv"]
    networks:
      - microservice_net

  inventory-service-web:
    build:
      context: ./services/inventory-service/
      dockerfile: nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      - inventory-service
    expose:
      - "80"
    networks:
      - microservice_net

  inventory-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${INVENTORY_DB_NAME}
      MYSQL_USER: ${INVENTORY_DB_USER}
      MYSQL_PASSWORD: ${INVENTORY_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${INVENTORY_DB_ROOT_PASSWORD}
    volumes:
      - inventory_db_data:/var/lib/mysql
    networks:
      - microservice_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  inventory-cache-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - microservice_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
