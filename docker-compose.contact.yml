services:
  contact-migrate:
    build:
      context: ./services/contact-service
      additional_contexts:
        infra: ./infrastructure
    restart: "no"
    depends_on:
      contact-db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_SECRET: "${CONTACT_APP_SECRET:-development-only-secret}"
      DEFAULT_URI: "${CONTACT_DEFAULT_URI:-http://localhost}"
      DATABASE_URL: "mysql://${CONTACT_DB_USER:-contact}:${CONTACT_DB_PASSWORD:-contact}@contact-db:3306/${CONTACT_DB_NAME:-contact_db}?serverVersion=8.4&charset=utf8mb4"
    command: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
    networks:
      - microservice_net
    develop:
      watch:
        - action: rebuild
          path: ./services/contact-service/migrations
        - action: rebuild
          path: ./services/contact-service/config
        - action: rebuild
          path: ./services/contact-service/composer.json
        - action: rebuild
          path: ./services/contact-service/composer.lock
        - action: rebuild
          path: ./services/contact-service/Dockerfile

  contact-service:
    build:
      context: ./services/contact-service
      additional_contexts:
        infra: ./infrastructure
    restart: unless-stopped
    depends_on:
      autodiscovery:
        condition: service_healthy
      authentication-service-web:
        condition: service_started
      contact-db:
        condition: service_healthy
      contact-cache-redis:
        condition: service_healthy
      contact-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: dev
      APP_SECRET: "${CONTACT_APP_SECRET:-development-only-secret}"
      DEFAULT_URI: "${CONTACT_DEFAULT_URI:-http://localhost}"
      DATABASE_URL: "mysql://${CONTACT_DB_USER:-contact}:${CONTACT_DB_PASSWORD:-contact}@contact-db:3306/${CONTACT_DB_NAME:-contact_db}?serverVersion=8.4&charset=utf8mb4"
      REDIS_URL: "redis://contact-cache-redis:6379"
      AUTHENTICATION_SERVICE_URL: "http://authentication-service-web"
      CONSUL_HTTP_ADDR: "http://autodiscovery:8500"
      CONSUL_SERVICE_NAME: "contact-service"
      CONSUL_SERVICE_PORT: "9000"
    entrypoint: ["/usr/local/bin/register.sh"]
    expose:
      - "9000"
    networks:
      - microservice_net
    develop:
      watch:
        - action: sync
          path: ./services/contact-service/src
          target: /srv/app/src
        - action: sync+restart
          path: ./services/contact-service/config
          target: /srv/app/config
        - action: sync
          path: ./services/contact-service/migrations
          target: /srv/app/migrations
        - action: sync
          path: ./services/contact-service/templates
          target: /srv/app/templates
        - action: sync
          path: ./services/contact-service/public
          target: /srv/app/public
        - action: rebuild
          path: ./services/contact-service/composer.json
        - action: rebuild
          path: ./services/contact-service/composer.lock
        - action: rebuild
          path: ./services/contact-service/Dockerfile
        - action: rebuild
          path: ./services/contact-service/docker/php.ini
        - action: rebuild
          path: ./services/contact-service/docker/php-fpm.conf

  contact-service-web:
    build:
      context: ./services/contact-service
      dockerfile: nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      - contact-service
    expose:
      - "80"
    networks:
      - microservice_net
    develop:
      watch:
        - action: sync+restart
          path: ./services/contact-service/docker/nginx.conf
          target: /etc/nginx/conf.d/default.conf
        - action: rebuild
          path: ./services/contact-service/nginx.Dockerfile

  contact-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${CONTACT_DB_NAME:-contact_db}
      MYSQL_USER: ${CONTACT_DB_USER:-contact}
      MYSQL_PASSWORD: ${CONTACT_DB_PASSWORD:-contact}
      MYSQL_ROOT_PASSWORD: ${CONTACT_DB_ROOT_PASSWORD:-root}
    volumes:
      - contact_db_data:/var/lib/mysql
    networks:
      - microservice_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  contact-cache-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - contact_redis_data:/data
    networks:
      - microservice_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
